<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee · Fun English Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .home-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1200;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            border-radius: 999px;
            background: rgba(255,255,255,.96);
            color: #23445b;
            border: 2px solid rgba(255,255,255,.8);
            box-shadow: 0 5px 18px rgba(0,0,0,.16);
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }
        .home-btn:hover { background: #eaf6ff; }
        @media (max-width: 520px) {
            .home-btn { top: 8px; left: 8px; padding: 8px 11px; font-size: 12px; }
            .start-card { margin-top: 36px; }
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4fa;
            transition: background 0.8s ease;
            padding: 16px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.8s ease, background-image 0.8s ease;
            z-index: -2;
            opacity: 0.35;
            filter: saturate(1.1) brightness(1.05);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.25) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .bg-level-0::before { background-image: url('https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=1600&q=80'); }
        .bg-level-1::before { background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80'); }
        .bg-level-2::before { background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1600&q=80'); }
        .bg-level-3::before { background-image: url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1600&q=80'); }
        .bg-level-4::before { background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&q=80'); }
        .bg-level-5::before { background-image: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1600&q=80'); }
        .bg-level-6::before { background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=80'); }
        .bg-level-7::before { background-image: url('https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=1600&q=80'); }
        .bg-level-8::before { background-image: url('https://images.unsplash.com/photo-1608889175123-8ee362201f81?w=1600&q=80'); }
        .bg-level-9::before { background-image: url('https://images.unsplash.com/photo-1439405326854-014607f694d7?w=1600&q=80'); }
        .bg-level-10::before { background-image: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=1600&q=80'); }
        .bg-level-11::before { background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600&q=80'); }

        /* ============ START SCREEN ============ */
        .start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a8d8ea 0%, #fddb92 100%);
            z-index: 1000;
            padding: 20px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 45px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 60px -15px rgba(0, 40, 80, 0.35);
            border: 3px solid white;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .start-card h1 {
            font-size: 2.2rem;
            color: #1e3a5f;
            margin-bottom: 8px;
        }

        .start-card .bee-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .start-card p {
            color: #5e6f7e;
            margin-bottom: 22px;
            font-size: 1rem;
        }

        .start-card label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .start-card input,
        .start-card select {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid #cbd8e6;
            font-size: 1.05rem;
            margin-bottom: 18px;
            outline: none;
            background: white;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: inherit;
            color: #1e3a5f;
        }

        .start-card input:focus,
        .start-card select:focus {
            border-color: #e6b422;
            box-shadow: 0 0 0 4px rgba(230, 180, 34, 0.25);
        }

        .start-btn {
            background: linear-gradient(135deg, #ffb347 0%, #ffcc33 100%);
            border: none;
            color: #4a2e00;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 16px 40px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c79200, 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c79200, 0 4px 10px rgba(0,0,0,0.15);
        }

        /* ============ GAME ============ */
        .game-container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(10px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 30, 0.45);
            padding: 26px 30px 30px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-badge {
            background: linear-gradient(135deg, #1e3c5c, #2e6b9b);
            color: white;
            padding: 7px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.92rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .user-badge {
            background: linear-gradient(135deg, #e6b422, #ffd93d);
            color: #4a2e00;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.88rem;
        }

        .lives-box {
            background: linear-gradient(135deg, #d94a4a, #b13e3e);
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 0 #6d2323, 0 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .lives-box.low {
            animation: pulse 0.8s infinite;
        }

        .timer-box {
            background: linear-gradient(135deg, #162b3a, #244657);
            color: #f2e9d0;
            padding: 7px 22px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 4px 0 #0b1a24, 0 6px 12px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: linear-gradient(135deg, #b13e3e, #d94a4a);
            color: #fff6e5;
            box-shadow: 0 4px 0 #6d2323, 0 6px 12px rgba(0,0,0,0.2);
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .combo-badge {
            background: linear-gradient(135deg, #ffd93d, #ffb347);
            color: #4a2e00;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.88rem;
            box-shadow: 0 3px 8px rgba(230, 180, 34, 0.4);
        }

        .motivation-area {
            background: linear-gradient(135deg, #eaf0f8, #d8e6f2);
            border-radius: 30px;
            padding: 10px 20px;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px solid #cddbe9;
        }

        .welcome-msg {
            font-weight: 700;
            color: #1f3b4e;
            font-size: 1rem;
        }

        .animal-helper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff6e0;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.92rem;
            color: #5d3f1a;
            font-weight: 600;
        }

        .animal-emoji {
            font-size: 1.6rem;
            line-height: 1;
        }

        .word-display {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 8px;
            color: #1e3a5f;
            margin: 10px 0 6px;
            text-transform: uppercase;
            min-height: 4rem;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 4px rgba(0,0,0,0.08);
            transition: color 0.3s;
        }

        .word-display.correct-flash {
            color: #2e9b4a;
            animation: flashGreen 0.5s;
        }

        .word-display.wrong-flash {
            color: #d94a4a;
            animation: flashRed 0.5s;
        }

        @keyframes flashGreen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes flashRed {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .spelling-hint {
            text-align: center;
            font-size: 1rem;
            color: #5e6f7e;
            margin-bottom: 14px;
            font-style: italic;
            min-height: 1.6rem;
        }

        .input-area {
            display: flex;
            gap: 12px;
            margin: 16px 0 10px;
        }

        .input-area input {
            flex: 1;
            padding: 16px 22px;
            font-size: 1.5rem;
            border-radius: 40px;
            border: 3px solid #cbd8e6;
            outline: none;
            background: white;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: 'Courier New', monospace;
            color: #1e3a5f;
        }

        .input-area input:focus {
            border-color: #e6b422;
            box-shadow: 0 0 0 5px rgba(230, 180, 34, 0.25);
        }

        .input-area button {
            background: linear-gradient(135deg, #2e6b9b, #1e4a6e);
            border: none;
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 0 30px;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 5px 0 #142f43, 0 8px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-area button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #142f43, 0 4px 8px rgba(0,0,0,0.15);
        }

        .input-area button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0 6px;
        }

        .action-buttons button {
            border: none;
            padding: 12px 22px;
            border-radius: 40px;
            font-weight: 700;
            color: #1e3a5f;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.1s;
            background: #f0f4fa;
            box-shadow: 0 3px 0 #b8c9da;
            border: 1px solid #d2dfec;
        }

        .action-buttons button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b8c9da;
        }

        .action-buttons button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .repeat-btn {
            background: linear-gradient(135deg, #ffd93d, #ffb347) !important;
            color: #4a2e00 !important;
            box-shadow: 0 3px 0 #c79200 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: #6c7e8f;
            margin-top: 16px;
            border-top: 1px solid #d2dfec;
            padding-top: 10px;
        }

        /* ============ CENTER TRANSITION / COUNTDOWN ============ */
        .transition-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .transition-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .transition-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 30px 50px;
            box-shadow: 0 25px 60px -10px rgba(0, 40, 80, 0.4);
            border: 4px solid white;
            text-align: center;
            max-width: 90vw;
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }

        .transition-card.correct {
            background: linear-gradient(135deg, #d4f7d4, #b8f0b8);
            border-color: #7ed957;
        }

        .transition-card.wrong {
            background: linear-gradient(135deg, #ffe0e0, #ffc9c9);
            border-color: #ff8b8b;
        }

        .transition-card.gameover {
            background: linear-gradient(135deg, #ffd4d4, #ffb8b8);
            border-color: #d94a4a;
        }

        .transition-card.countdown {
            background: linear-gradient(135deg, #fff3c4, #ffe0a3);
            border-color: #ffb347;
        }

        .transition-emoji {
            font-size: 4.5rem;
            line-height: 1;
            animation: wiggle 0.6s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.08); }
        }

        .transition-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1e3a5f;
            letter-spacing: 0.5px;
        }

        .transition-sub {
            font-size: 1rem;
            color: #5e6f7e;
            font-weight: 600;
        }

        .countdown-number {
            font-size: 6rem;
            font-weight: 900;
            color: #d94a4a;
            line-height: 1;
            animation: countPop 0.6s ease-out;
            text-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }

        @keyframes countPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffb347;
            top: -20px;
            z-index: 1001;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .game-container { padding: 18px 14px; }
            .word-display { font-size: 1.7rem; letter-spacing: 4px; }
            .input-area input { font-size: 1.2rem; padding: 12px 16px; }
            .input-area button { padding: 0 20px; font-size: 1.1rem; }
            .timer-box { font-size: 1rem; padding: 5px 14px; }
            .level-badge, .user-badge, .lives-box { font-size: 0.75rem; padding: 4px 12px; }
            .start-card { padding: 30px 22px; }
            .start-card h1 { font-size: 1.7rem; }
            .transition-text { font-size: 1.3rem; }
            .transition-emoji { font-size: 3.5rem; }
            .transition-card { padding: 24px 28px; }
            .countdown-number { font-size: 4rem; }
        }
    
/* ===== SELECTOR DE ESCUELAS ===== */
.school-search{position:relative;width:100%;}
.school-options{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d7e1eb;border-top:none;border-radius:0 0 12px 12px;max-height:200px;overflow-y:auto;z-index:10000;display:none;box-shadow:0 8px 16px rgba(11,49,85,.15);text-align:left;}
.school-option{padding:10px 14px;cursor:pointer;font-size:.9rem;color:#27354a;border-bottom:1px solid #f0f4f8;}
.school-option:hover{background:#f0f4f8;color:#123f68;font-weight:600;}
.school-option.no-results{color:#777;cursor:default;}
</style>

<!-- ============ START SCREEN ============ -->
<div class="start-screen" id="startScreen">
    <div class="start-card">
        <span class="bee-icon">🐝</span>
        <h1>Spelling Bee</h1>
        <p>Learn to spell in English while having fun!</p>

        <label for="username">👤 Student Name / Nombre del estudiante</label>
        <input type="text" id="username" placeholder="Escribe tu nombre..." maxlength="40" autocomplete="name" required>

        <label for="schoolInput">🏫 School / Escuela</label>
        <input type="text" id="schoolInput" placeholder="Escribe el nombre de tu escuela..." maxlength="80" autocomplete="organization" required>

        <label for="grade">🎓 Select your grade / Selecciona tu grado</label>
        <select id="grade">
            <option value="1-6">Grades 1–6 — 1:30 min per word</option>
            <option value="7-9">Grades 7–9 — 1:00 min per word</option>
            <option value="10-12">Grades 10–12 — 0:45 sec per word</option>
        </select>

        <button class="start-btn" id="startBtn">🚀 Let's Play!</button>
    </div>
</div>

<!-- ============ CENTER TRANSITION / COUNTDOWN ============ -->
<div class="transition-overlay" id="transitionOverlay">
    <div class="transition-card" id="transitionCard">
        <div class="transition-emoji" id="transitionEmoji">🦊</div>
        <div class="transition-text" id="transitionText">Great!</div>
        <div class="transition-sub" id="transitionSub"></div>
    </div>
</div>

<!-- ============ GAME CONTAINER ============ -->
<div class="game-container" id="gameContainer" style="display:none;">
    <div class="header">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <div class="level-badge" id="levelBadge">🐝 Level 1 · Zoo</div>
            <div class="user-badge" id="userBadge">👤 Player</div>
            <div class="lives-box" id="livesBox">❤️❤️❤️</div>
        </div>
        <div class="timer-box" id="timerDisplay">1:30</div>
    </div>

    <div class="motivation-area">
        <div class="welcome-msg" id="welcomeMsg">Welcome, champion! 🏆</div>
        <div class="animal-helper">
            <span class="animal-emoji" id="animalEmoji">🦊</span>
            <span id="animalPhrase">You can do it!</span>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <div class="combo-badge" id="comboBadge">🔥 Combo: 0</div>
        <div style="font-size: 0.8rem; color: #6c7e8f;" id="progressInfo">Word 1</div>
    </div>

    <div class="word-display" id="wordDisplay">---</div>
    <div class="spelling-hint" id="spellingHint"></div>

    <div class="input-area">
        <input type="text" id="answerInput" placeholder="Type the word..." autocomplete="off" spellcheck="false">
        <button id="submitBtn" aria-label="Submit answer">↵</button>
    </div>

    <div class="action-buttons">
        <button class="repeat-btn" id="repeatBtn">🔊 Repeat</button>
        <button id="skipBtn">⏭️ Skip</button>
        <button id="restartBtn" title="Restart game">🔄 Restart</button>
    </div>

    <div class="footer-note">
        Spelling Bee · progressive difficulty · clear American/British voice
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js"></script>
<script>
(function () {
    // ---------- LEVELS (5 palabras por nivel, sencillas y variadas) ----------
    const LEVELS = [
        { name: 'Zoo', bgClass: 'bg-level-0', words: ['fox', 'owl', 'bat', 'cub', 'yak'] },
        { name: 'Vacation', bgClass: 'bg-level-1', words: ['sun', 'sea', 'sky', 'sand', 'beach'] },
        { name: 'School', bgClass: 'bg-level-2', words: ['pen', 'book', 'desk', 'pencil', 'notebook'] },
        { name: 'City', bgClass: 'bg-level-3', words: ['bus', 'car', 'park', 'street', 'avenue'] },
        { name: 'Restaurant', bgClass: 'bg-level-4', words: ['menu', 'fork', 'soup', 'waiter', 'dessert'] },
        { name: 'Family', bgClass: 'bg-level-5', words: ['mom', 'dad', 'baby', 'cousin', 'grandfather'] },
        { name: 'Park', bgClass: 'bg-level-6', words: ['tree', 'bench', 'slide', 'fountain', 'playground'] },
        { name: 'Comics', bgClass: 'bg-level-7', words: ['hero', 'comic', 'sketch', 'adventure', 'illustrator'] },
        { name: 'Superheroes', bgClass: 'bg-level-8', words: ['hulk', 'thor', 'cape', 'guardian', 'extraordinary'] },
        { name: 'Ocean', bgClass: 'bg-level-9', words: ['crab', 'seal', 'coral', 'dolphin', 'lighthouse'] },
        { name: 'Compound Words', bgClass: 'bg-level-10', words: ['raincoat', 'cupcake', 'rainbow', 'watermelon', 'thunderstorm'] },
        { name: 'Simple Sentences', bgClass: 'bg-level-11', words: ['The cat naps', 'The sun is hot', 'We plant seeds', 'Children play here', 'The moon shines bright'] }
    ];

    const GRADE_TIMES = { '1-6': 90, '7-9': 60, '10-12': 45 };
    const MAX_LIVES = 3;

    // ---------- STATE ----------
    let username = 'Player';
    let schoolName = '';
    let gradeRange = '1-6';
    let correctAnswers = 0;
    let scoreSaved = false;
    let currentLevel = 0;
    let currentWordIndex = 0;
    let currentWord = '';
    let timeLeft = 90;
    let timerInterval = null;
    let isGameActive = true;
    let combo = 0;
    let maxCombo = 0;
    let lives = MAX_LIVES;
    let audioCtx = null;
    let musicNodes = [];
    let isEvaluating = false;
    let voicesLoaded = false;
    let gameOver = false;
    let gameStarted = false;

    // DOM
    const startScreen = document.getElementById('startScreen');
    const gameContainer = document.getElementById('gameContainer');
    const levelBadge = document.getElementById('levelBadge');
    const userBadge = document.getElementById('userBadge');
    const livesBox = document.getElementById('livesBox');
    const timerDisplay = document.getElementById('timerDisplay');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const animalEmoji = document.getElementById('animalEmoji');
    const animalPhrase = document.getElementById('animalPhrase');
    const comboBadge = document.getElementById('comboBadge');
    const progressInfo = document.getElementById('progressInfo');
    const wordDisplay = document.getElementById('wordDisplay');
    const spellingHint = document.getElementById('spellingHint');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const skipBtn = document.getElementById('skipBtn');
    const restartBtn = document.getElementById('restartBtn');
    const transitionOverlay = document.getElementById('transitionOverlay');
    const transitionCard = document.getElementById('transitionCard');
    const transitionEmoji = document.getElementById('transitionEmoji');
    const transitionText = document.getElementById('transitionText');
    const transitionSub = document.getElementById('transitionSub');

    // ---------- LOAD VOICES ----------
    function loadVoices() {
        return new Promise((resolve) => {
            if (!window.speechSynthesis) { resolve([]); return; }
            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) { voicesLoaded = true; resolve(voices); return; }
            window.speechSynthesis.onvoiceschanged = () => {
                voices = window.speechSynthesis.getVoices();
                voicesLoaded = true;
                resolve(voices);
            };
            setTimeout(() => {
                voices = window.speechSynthesis.getVoices();
                voicesLoaded = true;
                resolve(voices);
            }, 800);
        });
    }

    // ---------- HAPPY MUSIC ----------
    function startHappyMusic() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.08;
            masterGain.connect(audioCtx.destination);

            const chordFreqs = [
                [261.63, 329.63, 392.00],
                [196.00, 246.94, 293.66],
                [220.00, 261.63, 329.63],
                [174.61, 220.00, 261.63]
            ];
            let chordIndex = 0;

            function playChord() {
                const now = audioCtx.currentTime;
                const chord = chordFreqs[chordIndex % chordFreqs.length];
                chord.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = i === 0 ? 'triangle' : 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.35, now + 0.15);
                    gain.gain.linearRampToValueAtTime(0, now + 1.7);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(now);
                    osc.stop(now + 1.8);
                });
                chordIndex++;
            }
            playChord();
            const musicInterval = setInterval(playChord, 1700);

            const melodyNotes = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46];
            let noteIndex = 0;
            const melodyInterval = setInterval(() => {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = melodyNotes[noteIndex % melodyNotes.length];
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.55);
                noteIndex++;
            }, 420);

            musicNodes.push({ musicInterval, melodyInterval, masterGain });
        } catch (e) { console.warn('Audio not available', e); }
    }

    // ---------- VOICE SELECTION ----------
    // Dama = American (en-US), Hombre = British (en-GB)
    const CLEAR_FEMALE_VOICES = [
        'Google US English', 'Samantha', 'Karen', 'Zira', 'Microsoft Zira',
        'Microsoft Aria', 'Serena', 'Victoria', 'Microsoft Michelle'
    ];
    const CLEAR_MALE_VOICES = [
        'Google UK English Male', 'Daniel', 'Microsoft George', 'Google UK English',
        'Microsoft Ryan', 'Oliver', 'Arthur'
    ];

    // Dama siempre americana, hombre siempre británico
    function getVoiceForType(voiceType) {
        if (voiceType === 'woman') return { lang: 'en-US', keywords: CLEAR_FEMALE_VOICES, fallback: ['female', 'zira', 'samantha', 'karen', 'serena', 'victoria', 'aria', 'michelle'] };
        else return { lang: 'en-GB', keywords: CLEAR_MALE_VOICES, fallback: ['male', 'daniel', 'george', 'oliver', 'arthur', 'ryan', 'uk english'] };
    }

    function findBestVoice(voiceType) {
        const voices = window.speechSynthesis.getVoices();
        const cfg = getVoiceForType(voiceType);
        const targetLang = cfg.lang;

        // First try exact language match
        let candidates = voices.filter(v => v.lang === targetLang);
        if (candidates.length === 0) candidates = voices.filter(v => v.lang.startsWith(targetLang.split('-')[0]));
        if (candidates.length === 0) candidates = voices;

        // Try preferred names
        for (const name of cfg.keywords) {
            const match = candidates.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
            if (match) return match;
        }
        // Try keywords
        for (const kw of cfg.fallback) {
            const match = candidates.find(v => v.name.toLowerCase().includes(kw));
            if (match) return match;
        }
        return candidates[0] || null;
    }

    // ---------- SPEAK PHRASES (SLOWER) ----------
    function speakText(text, voiceType = 'woman', rate = 0.75) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();

        const cfg = getVoiceForType(voiceType);
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = rate; // slower and clearer
        utterance.volume = 1;
        utterance.pitch = voiceType === 'woman' ? 1.1 : 0.95;
        utterance.lang = cfg.lang;

        const voice = findBestVoice(voiceType);
        if (voice) utterance.voice = voice;

        setTimeout(() => window.speechSynthesis.speak(utterance), 80);
    }

    // ---------- SPELL WORD: primero deletrea, luego pronuncia (MÁS LENTO) ----------
    function spellWordLetterByLetter(word, voiceType) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();

        const cfg = getVoiceForType(voiceType);
        const voice = findBestVoice(voiceType);
        const lang = cfg.lang;
        const basePitch = voiceType === 'woman' ? 1.1 : 0.95;

        const words = word.split(' ');
        let wIndex = 0;

        function spellCurrentWord() {
            if (wIndex >= words.length) return;
            const w = words[wIndex];
            const letters = w.split('');
            let lIndex = 0;

            function speakLetter() {
                if (lIndex >= letters.length) {
                    // Say the whole word at the end
                    setTimeout(() => {
                        const finalUtter = new SpeechSynthesisUtterance(w);
                        finalUtter.rate = 0.7;   // slow and clear
                        finalUtter.pitch = basePitch;
                        finalUtter.lang = lang;
                        finalUtter.volume = 1;
                        if (voice) finalUtter.voice = voice;

                        finalUtter.onend = () => {
                            wIndex++;
                            if (wIndex < words.length) setTimeout(spellCurrentWord, 600);
                        };
                        window.speechSynthesis.speak(finalUtter);
                    }, 600);
                    return;
                }

                const letter = letters[lIndex];
                const letterUtter = new SpeechSynthesisUtterance(letter.toUpperCase());
                letterUtter.rate = 0.55;   // MUCH slower for clarity
                letterUtter.pitch = basePitch;
                letterUtter.lang = lang;
                letterUtter.volume = 1;
                if (voice) letterUtter.voice = voice;

                letterUtter.onend = () => {
                    lIndex++;
                    setTimeout(speakLetter, 500);  // longer pause between letters
                };
                window.speechSynthesis.speak(letterUtter);
            }
            speakLetter();
        }

        setTimeout(spellCurrentWord, 300);
    }

    function randomVoiceType() {
        return Math.random() > 0.5 ? 'woman' : 'man';
    }

    // ---------- ANIMALS & PHRASES ----------
    const ANIMALS_OK = ['🦊','🐼','🐨','🦁','🐸','🐧','🦉','🐝','🐳','🦄','🐶','🐱','🐰','🐹','🦋','🐢'];
    const ANIMALS_FAIL = ['🐢','🐌','🐛','🦔','🐿️','🦥','🐨','🐼'];
    const PHRASES_OK = ['Great job!','Excellent!','You are amazing!','Keep it up!','Perfect!','Well done!','Champion!','Wow, you did it!','So smart!','Super!'];
    const PHRASES_FAIL = ['Try again!','Almost there!','Don\'t give up!','You can do it!','Cheer up!','Next one is yours!','Keep practicing!','You are doing great!'];

    // ---------- UTILITIES ----------
    function getTimeForLevel() { return GRADE_TIMES[gradeRange] || 90; }

    function updateBackground() {
        document.body.className = LEVELS[currentLevel].bgClass;
        levelBadge.textContent = `🐝 Level ${currentLevel + 1} · ${LEVELS[currentLevel].name}`;
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.textContent = `${m}:${s.toString().padStart(2, '0')}`;
        timerDisplay.classList.toggle('warning', timeLeft <= 10);
    }

    function updateLivesDisplay() {
        let hearts = '';
        for (let i = 0; i < MAX_LIVES; i++) {
            hearts += i < lives ? '❤️' : '🖤';
        }
        livesBox.textContent = hearts;
        livesBox.classList.toggle('low', lives === 1);
    }

    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

    function startTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
            if (!isGameActive || gameOver || !gameStarted) return;
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                stopTimer();
                handleWrongAnswer('⏰ Time\'s up!');
            }
        }, 1000);
    }

    function resetTimerForLevel() {
        timeLeft = getTimeForLevel();
        updateTimerDisplay();
    }

    function updateComboBadge() {
        comboBadge.textContent = `🔥 Combo: ${combo}`;
        if (combo > maxCombo) maxCombo = combo;
    }

    // ---------- CENTER TRANSITION ----------
    function showTransition(isCorrect, mainText, subText, emoji, isGameOver = false, isCountdown = false) {
        transitionCard.classList.remove('correct', 'wrong', 'gameover', 'countdown');
        if (isGameOver) transitionCard.classList.add('gameover');
        else if (isCountdown) transitionCard.classList.add('countdown');
        else transitionCard.classList.add(isCorrect ? 'correct' : 'wrong');
        transitionEmoji.textContent = emoji;
        transitionText.textContent = mainText;
        transitionSub.textContent = subText || '';
        transitionOverlay.classList.add('show');

        if (isCorrect && !isGameOver && !isCountdown) createConfetti();

        setTimeout(() => {
            transitionOverlay.classList.remove('show');
        }, isGameOver ? 3000 : (isCountdown ? 900 : 1200));
    }

    function showCountdownNumber(num) {
        transitionCard.classList.remove('correct', 'wrong', 'gameover', 'countdown');
        transitionCard.classList.add('countdown');
        transitionEmoji.textContent = '';
        transitionText.innerHTML = `<div class="countdown-number">${num}</div>`;
        transitionSub.textContent = '';
        transitionOverlay.classList.add('show');
        setTimeout(() => {
            transitionOverlay.classList.remove('show');
        }, 900);
    }

    function showWelcomeTransition(name) {
        transitionCard.classList.remove('correct', 'wrong', 'gameover', 'countdown');
        transitionCard.classList.add('countdown');
        transitionEmoji.textContent = '🐝';
        transitionText.textContent = `Welcome, ${name}!`;
        transitionSub.textContent = 'Good luck!';
        transitionOverlay.classList.add('show');
    }

    function showGoodLuckTransition() {
        transitionCard.classList.remove('correct', 'wrong', 'gameover', 'countdown');
        transitionCard.classList.add('countdown');
        transitionEmoji.textContent = '🍀';
        transitionText.textContent = 'Good luck!';
        transitionSub.textContent = '';
        transitionOverlay.classList.add('show');
    }

    function createConfetti() {
        const colors = ['#ffb347', '#ffd93d', '#7ed957', '#4a9eff', '#ff6b9d', '#c084fc'];
        for (let i = 0; i < 25; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
            c.style.animationDelay = (Math.random() * 0.4) + 's';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            c.style.width = c.style.height = (6 + Math.random() * 8) + 'px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3500);
        }
    }

    // ---------- SAVE SCORE TO SUPABASE ----------
    async function saveSpellingBeeScore() {
        if (scoreSaved) return;
        scoreSaved = true;
        if (typeof supabaseClient === 'undefined' || !supabaseClient) {
            console.warn('Supabase client is not available; score was not uploaded.');
            return;
        }
        const { error } = await supabaseClient.from('puntajes').insert([{
            nombre: username,
            escuela: schoolName,
            grado: String(gradeRange),
            materia: 'Inglés',
            juego: 'Spelling Bee',
            puntaje: Number(correctAnswers * 10)
        }]);
        if (error) console.error('Error saving Spelling Bee score:', error);
    }

    // ---------- GAME OVER ----------
    function triggerGameOver() {
        gameOver = true;
        isGameActive = false;
        saveSpellingBeeScore();
        stopTimer();
        answerInput.disabled = true;
        submitBtn.disabled = true;
        skipBtn.disabled = true;
        repeatBtn.disabled = true;

        wordDisplay.textContent = '💔 GAME OVER';
        spellingHint.textContent = `You ran out of lives, ${username}.`;

        showTransition(false, 'GAME OVER', `You completed ${currentLevel} level${currentLevel !== 1 ? 's' : ''} · Max combo: ${maxCombo}`, '💔', true);

        const v = randomVoiceType();
        speakText(`Game over ${username}. Try again!`, v, 0.75);
    }

    // ---------- LOAD WORD ----------
    function loadWord() {
        if (gameOver) return;

        const level = LEVELS[currentLevel];
        if (currentWordIndex >= level.words.length) {
            if (currentLevel < LEVELS.length - 1) {
                currentLevel++;
                currentWordIndex = 0;
                updateBackground();
                resetTimerForLevel();
                const levelWelcome = `Level ${currentLevel + 1}. ${LEVELS[currentLevel].name}!`;
                welcomeMsg.textContent = `🌟 ${levelWelcome}`;
                showTransition(true, `Level ${currentLevel + 1}!`, LEVELS[currentLevel].name, '🌟');
                const v = randomVoiceType();
                speakTextThenCallback(levelWelcome, v, 0.75, () => {
                    loadWord();
                });
                return;
            } else {
                stopTimer();
                isGameActive = false;
                wordDisplay.textContent = '🏆 YOU WIN!';
                spellingHint.textContent = `You completed all levels, ${username}!`;
                answerInput.disabled = true;
                submitBtn.disabled = true;
                skipBtn.disabled = true;
                repeatBtn.disabled = true;
                showTransition(true, 'YOU ARE A CHAMPION!', `Max combo: ${maxCombo} · Lives left: ${lives}`, '🏆', true);
                speakText(`Congratulations ${username}! You are a spelling champion!`, 'woman', 0.75);
                return;
            }
        }

        currentWord = level.words[currentWordIndex];
        const displayWord = currentWord.split('').map(ch => ch === ' ' ? ' ' : '_').join(' ');
        wordDisplay.textContent = displayWord;
        wordDisplay.classList.remove('correct-flash', 'wrong-flash');
        spellingHint.textContent = `Theme: ${level.name} · ${currentWord.length} letters`;
        progressInfo.textContent = `Word ${currentWordIndex + 1} of ${level.words.length}`;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        isEvaluating = false;

        let welcomePhrase;
        if (currentWordIndex === 0 && currentLevel === 0) {
            welcomePhrase = `Welcome, ${username}!`;
        } else {
            welcomePhrase = PHRASES_OK[Math.floor(Math.random() * PHRASES_OK.length)];
        }
        welcomeMsg.textContent = `✨ ${welcomePhrase}`;

        const voiceType = randomVoiceType();
        spellWordLetterByLetter(currentWord, voiceType);

        isGameActive = true;
    }

    // Helper: speak text and run a callback when done
    function speakTextThenCallback(text, voiceType, rate, callback) {
        if (!window.speechSynthesis) { callback && callback(); return; }
        window.speechSynthesis.cancel();

        const cfg = getVoiceForType(voiceType);
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = rate;
        utterance.volume = 1;
        utterance.pitch = voiceType === 'woman' ? 1.1 : 0.95;
        utterance.lang = cfg.lang;
        const voice = findBestVoice(voiceType);
        if (voice) utterance.voice = voice;

        let called = false;
        const done = () => {
            if (called) return;
            called = true;
            if (callback) callback();
        };
        utterance.onend = done;
        utterance.onerror = done;
        setTimeout(done, 5000);

        setTimeout(() => window.speechSynthesis.speak(utterance), 80);
    }

    // ---------- INSTANT EVALUATION ----------
    function checkAnswerInstantly() {
        if (!isGameActive || isEvaluating || gameOver || !gameStarted) return;
        const userAnswer = answerInput.value.trim().toLowerCase();
        const correct = currentWord.toLowerCase();

        if (userAnswer.length === correct.length) {
            if (userAnswer === correct) {
                evaluateCorrect();
            } else {
                evaluateWrong('❌ Wrong answer');
            }
        }
    }

    function evaluateCorrect() {
        if (isEvaluating || gameOver) return;
        isEvaluating = true;
        combo++;
        correctAnswers++;
        updateComboBadge();

        const animal = ANIMALS_OK[Math.floor(Math.random() * ANIMALS_OK.length)];
        animalEmoji.textContent = animal;
        const praise = PHRASES_OK[Math.floor(Math.random() * PHRASES_OK.length)];
        animalPhrase.textContent = praise;

        wordDisplay.textContent = currentWord.split('').join(' ');
        wordDisplay.classList.add('correct-flash');

        showTransition(true, praise, `Correct! ${currentWord}`, animal);

        const v = randomVoiceType();
        speakText(praise, v, 0.75);

        stopTimer();
        isGameActive = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;

        setTimeout(() => {
            currentWordIndex++;
            resetTimerForLevel();
            startTimer();
            loadWord();
        }, 1600);
    }

    function evaluateWrong(msg = '') {
        if (isEvaluating || gameOver) return;
        isEvaluating = true;
        combo = 0;
        updateComboBadge();

        lives--;
        updateLivesDisplay();

        const animal = ANIMALS_FAIL[Math.floor(Math.random() * ANIMALS_FAIL.length)];
        animalEmoji.textContent = animal;
        const failPhrase = PHRASES_FAIL[Math.floor(Math.random() * PHRASES_FAIL.length)];
        animalPhrase.textContent = failPhrase;

        wordDisplay.textContent = currentWord.split('').join(' ');
        wordDisplay.classList.add('wrong-flash');

        const livesMsg = lives > 0 ? `Lives left: ${lives}` : 'No lives left!';
        showTransition(false, failPhrase, `It was: ${currentWord} · ${livesMsg}`, animal);

        const v = randomVoiceType();
        speakText(failPhrase, v, 0.75);

        if (msg) spellingHint.textContent = msg;
        stopTimer();
        isGameActive = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;

        if (lives <= 0) {
            setTimeout(() => triggerGameOver(), 1600);
            return;
        }

        setTimeout(() => {
            currentWordIndex++;
            resetTimerForLevel();
            startTimer();
            loadWord();
        }, 1600);
    }

    function handleWrongAnswer(msg = '') {
        if (isEvaluating || gameOver) return;
        evaluateWrong(msg);
    }

    // ---------- REPEAT / SKIP ----------
    function repeatAudio() {
        if (!currentWord || gameOver) return;
        const v = randomVoiceType();
        spellWordLetterByLetter(currentWord, v);
    }

    function skipWord() {
        if (!isGameActive || isEvaluating || gameOver) return;
        stopTimer();
        combo = 0;
        updateComboBadge();
        lives--;
        updateLivesDisplay();
        const animal = ANIMALS_FAIL[Math.floor(Math.random() * ANIMALS_FAIL.length)];
        animalEmoji.textContent = animal;
        animalPhrase.textContent = 'Skipped! -1 life';
        const v = randomVoiceType();
        speakText('Skipping word. One life lost.', v, 0.75);

        if (lives <= 0) {
            triggerGameOver();
            return;
        }

        currentWordIndex++;
        resetTimerForLevel();
        setTimeout(() => {
            startTimer();
            loadWord();
        }, 1200);
    }

    // ---------- EVENT LISTENERS ----------
    function setupListeners() {
        answerInput.addEventListener('input', () => {
            const typed = answerInput.value.trim();
            const target = currentWord;
            if (!isGameActive || isEvaluating || gameOver || !gameStarted) return;
            if (typed.length === target.length) {
                setTimeout(checkAnswerInstantly, 30);
            }
        });

        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!isGameActive || isEvaluating || gameOver || !gameStarted) return;
                const userAnswer = answerInput.value.trim().toLowerCase();
                const correct = currentWord.toLowerCase();
                if (userAnswer === correct) {
                    evaluateCorrect();
                } else {
                    evaluateWrong('❌ Wrong answer');
                }
            }
        });

        submitBtn.addEventListener('click', () => {
            if (!isGameActive || isEvaluating || gameOver || !gameStarted) return;
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correct = currentWord.toLowerCase();
            if (userAnswer === correct) {
                evaluateCorrect();
            } else {
                evaluateWrong('❌ Wrong answer');
            }
        });

        repeatBtn.addEventListener('click', repeatAudio);
        skipBtn.addEventListener('click', skipWord);

        restartBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to restart the game?')) location.reload();
        });
    }

    // ---------- START SCREEN ----------
    document.getElementById('startBtn').addEventListener('click', async () => {
        const nameInput = document.getElementById('username').value.trim();
        const schoolInput = document.getElementById('schoolInput').value.trim();
        if (!nameInput || !schoolInput) {
            alert('Por favor, escribe tu nombre y el nombre de tu escuela.');
            return;
        }
        username = nameInput;
        schoolName = schoolInput;
        gradeRange = document.getElementById('grade').value;
        correctAnswers = 0;
        scoreSaved = false;
        startHappyMusic();
        await loadVoices();
        startScreen.classList.add('hidden');
        gameContainer.style.display = 'block';
        initGame();
    });

    // ---------- INIT GAME (con bienvenida calmada y countdown) ----------
    async function initGame() {
        await loadVoices();

        currentLevel = 0;
        currentWordIndex = 0;
        combo = 0;
        maxCombo = 0;
        lives = MAX_LIVES;
        gameOver = false;
        gameStarted = false;
        updateComboBadge();
        updateLivesDisplay();
        userBadge.textContent = `👤 ${username}`;
        updateBackground();
        timeLeft = getTimeForLevel();
        updateTimerDisplay();

        welcomeMsg.textContent = `✨ Welcome, ${username}!`;

        // 1. Welcome transition + slow speech
        showWelcomeTransition(username);
        const welcomePhrase = `Welcome ${username}!`;
        const v = randomVoiceType();

        speakTextThenCallback(welcomePhrase, v, 0.75, () => {
            // 2. Good luck transition + slow speech
            showGoodLuckTransition();
            const goodLuckPhrase = 'Good luck!';
            const v2 = randomVoiceType();
            speakTextThenCallback(goodLuckPhrase, v2, 0.75, () => {
                // 3. Countdown 3-2-1 with voice
                runCountdown(() => {
                    gameStarted = true;
                    resetTimerForLevel();
                    startTimer();
                    loadWord();
                    answerInput.focus();
                });
            });
        });

        setupListeners();
    }

    function runCountdown(callback) {
        const numbers = [3, 2, 1];
        let idx = 0;

        function nextNumber() {
            if (idx >= numbers.length) {
                transitionCard.classList.remove('correct', 'wrong', 'gameover', 'countdown');
                transitionCard.classList.add('correct');
                transitionEmoji.textContent = '🚀';
                transitionText.textContent = 'GO!';
                transitionSub.textContent = '';
                transitionOverlay.classList.add('show');
                const vGo = randomVoiceType();
                speakText('Go!', vGo, 0.85);
                setTimeout(() => {
                    transitionOverlay.classList.remove('show');
                    callback();
                }, 900);
                return;
            }

            const num = numbers[idx];
            showCountdownNumber(num);
            const v = randomVoiceType();
            speakText(String(num), v, 0.85);
            idx++;
            setTimeout(nextNumber, 1100);
        }
        nextNumber();
    }

    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voicesLoaded = true;
        };
    }
})();

(function initSchoolSelector(){
  const schoolEl = document.getElementById('schoolInput') || document.getElementById('schoolName');
  if(!schoolEl) return;
  let wrap = schoolEl.closest('.school-search');
  if(!wrap){
    wrap=document.createElement('div'); wrap.className='school-search';
    schoolEl.parentNode.insertBefore(wrap,schoolEl); wrap.appendChild(schoolEl);
  }
  let opts=wrap.querySelector('.school-options');
  if(!opts){ opts=document.createElement('div'); opts.className='school-options'; opts.id='schoolOptions'; wrap.appendChild(opts); }
  const normal=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  function showSchoolOptions(){
    const q=normal(schoolEl.value);
    const matches=escuelas.filter(e=>normal(e).includes(q));
    opts.innerHTML='';
    if(!matches.length){
      const d=document.createElement('div'); d.className='school-option no-results'; d.textContent='No se encontraron escuelas'; opts.appendChild(d);
    }else matches.forEach(e=>{
      const d=document.createElement('div'); d.className='school-option'; d.textContent=e;
      d.addEventListener('mousedown',ev=>{ev.preventDefault(); schoolEl.value=e; opts.style.display='none'; schoolEl.dispatchEvent(new Event('input',{bubbles:true})); schoolEl.dispatchEvent(new Event('change',{bubbles:true}));});
      opts.appendChild(d);
    });
    opts.style.display='block';
  }
  schoolEl.addEventListener('focus',showSchoolOptions);
  schoolEl.addEventListener('input',showSchoolOptions);
  document.addEventListener('click',e=>{if(!wrap.contains(e.target)) opts.style.display='none';});
})();
</script>
